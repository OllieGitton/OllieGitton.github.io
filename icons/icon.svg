<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Background rounded square -->
  <rect width="512" height="512" rx="110" ry="110" fill="#6c12aa"/>

  <!-- EAR - gold, detailed shape using bezier paths -->
  <g transform="translate(105, 80)" fill="#FFD700">
    <!-- Outer ear body -->
    <path d="
      M 115 20
      C 60 20, 15 70, 15 145
      C 15 195, 35 235, 65 260
      C 75 268, 82 278, 80 292
      C 78 308, 68 318, 68 330
      C 68 355, 88 370, 108 365
      C 128 360, 138 340, 135 318
      C 132 300, 122 288, 118 272
      C 145 258, 165 220, 165 175
      C 168 165, 172 158, 175 152
      C 182 135, 178 100, 165 78
      C 150 52, 135 20, 115 20 Z
    " />
    <!-- Inner ear cutout (purple to create hollow effect) -->
    <path d="
      M 115 50
      C 78 50, 48 88, 48 145
      C 48 188, 66 222, 92 244
      C 104 254, 112 266, 110 282
      C 108 298, 98 310, 98 328
      C 98 342, 106 350, 115 348
      C 124 346, 130 336, 128 320
      C 126 304, 116 290, 113 272
      C 138 255, 152 215, 150 172
      C 152 162, 156 154, 160 146
      C 166 130, 162 100, 150 80
      C 140 62, 128 50, 115 50 Z
    " fill="#6c12aa"/>
    <!-- Inner ear canal / helix detail -->
    <path d="
      M 105 90
      C 80 95, 68 120, 72 148
      C 74 162, 82 174, 92 180
    " fill="none" stroke="#FFD700" stroke-width="14" stroke-linecap="round"/>
    <!-- Tragus (small bump at bottom of canal) -->
    <ellipse cx="88" cy="192" rx="14" ry="10" fill="#FFD700"/>
  </g>

  <!-- SOUND WAVES - right side -->
  <g fill="none" stroke-linecap="round">
    <path d="M 345 195 Q 375 256 345 317" stroke="#FFD700" stroke-width="18" opacity="1.0"/>
    <path d="M 375 168 Q 418 256 375 344" stroke="#FFD700" stroke-width="16" opacity="0.7"/>
    <path d="M 405 142 Q 460 256 405 370" stroke="#FFD700" stroke-width="14" opacity="0.4"/>
  </g>
</svg>
